<script>
var CFG=window.CFG||{},$=function(s){return document.querySelector(s)},app=$("#app"),ALL=[],S=null,P={},V="login",cur=null,T=null,tab="join",msg="";
F.forEach(function(f){ALL=ALL.concat(f[1])});
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function cell(x,y){return String.fromCharCode(64+x)+y}
function endOf(id){var p=EX[id].p,n=p.length;return n?[p[n-2],p[n-1]]:[8,8]}
function inv(id){return !!EX[id].s}
function fk(id){for(var k=0;k<F.length;k++)if(F[k][1].indexOf(id)>-1)return k}

try{S=JSON.parse(localStorage.getItem("ap_s")||"null")}catch(e){}
/* ---------- affichage du code (mise en forme seulement : le texte reste le même) ----------
   Coloration du Python reprise de QuizzNSI (js/commun.js, même auteur, MIT) : mots-clés en gras,
   fonctions soulignées, chaînes en italique, nombres, commentaires ; guides d'indentation par niveau. */
var MOTS={},NATIFS={};"False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" ").forEach(function(m){MOTS[m]=1});
"print len range list int str float bool min max sum abs input".split(" ").forEach(function(m){NATIFS[m]=1});
function colorer(l){var h="",m,pr="",re=/(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_À-ÿ][A-Za-z_0-9À-ÿ]*)|(\s+)|(.)/g;
while((m=re.exec(l))!==null){if(m[0]===""){re.lastIndex++;continue}
if(m[1])h+='<span class="tk-com">'+esc(m[1])+'</span>';else if(m[2])h+='<span class="tk-ch">'+esc(m[2])+'</span>';else if(m[3])h+='<span class="tk-nb">'+m[3]+'</span>';
else if(m[4]){if(MOTS[m[4]])h+='<span class="tk-mot">'+m[4]+'</span>';else if(/^\s*\(/.test(l.slice(re.lastIndex)))h+='<span class="tk-fn'+(NATIFS[m[4]]?' tk-nat':'')+'">'+esc(m[4])+'</span>';else h+=esc(m[4])}
else h+=esc(m[0]).replace(/>/g,"&gt;");if(m[4])pr=m[4];else if(!/^\s+$/.test(m[0]))pr=""}return h}
function lignes(src,num){return String(src).split("\n").map(function(l,i){var ind=(l.match(/^ */)||[""])[0].length,k=Math.floor(ind/4),gd="";
for(var j=0;j<k;j++)gd+='<span class="al-ind n'+(j%4)+'">    </span>';
return '<span class="ligne">'+(num?'<span class="num" aria-hidden="true">'+(i+1)+'</span>':'')+gd+colorer(l.slice(k*4))+'</span>'}).join("")}
function bloc(src){return '<pre class="al-code"><code>'+lignes(src,true)+'</code></pre>'}
function miroir(src){return '<span class="al-miroir-in">'+lignes(src,true)+'</span>'}
/* ---------- grille ---------- */
var g='<rect style="fill:var(--td-fond)" width="160" height="160"/><rect style="fill:var(--td-panneau-2)" width="160" height="10"/><rect style="fill:var(--td-panneau-2)" width="10" height="160"/><rect style="fill:var(--td-bande-2)" x="80" y="80" width="10" height="10"/>';
for(var i=0;i<=16;i++){g+='<path style="stroke:var(--td-encre)" d="M'+10*i+' 0V160M0 '+10*i+'H160" stroke-width="'+((i<2||i==16)?.9:(i==6||i==11)?.7:.3)+'"/>'}
for(i=0;i<15;i++){g+='<text style="fill:var(--td-encre);font-family:var(--td-texte)" x="'+(15+i*10)+'" y="7.4" font-size="6.6" text-anchor="middle" font-weight="700">'+String.fromCharCode(65+i)+'</text><text style="fill:var(--td-encre);font-family:var(--td-texte)" x="5" y="'+(17.4+i*10)+'" font-size="6.6" text-anchor="middle" font-weight="700">'+(i+1)+'</text>'}
var al='<g><path d="M83.7 82.6 82.4 80.9M86.3 82.6 87.6 80.9" fill="none" stroke-width=".5" style="stroke:var(--td-encre)"/><circle cx="82.3" cy="80.8" r=".55" fill="#2FA84F" stroke-width=".3" style="stroke:var(--td-encre)"/><circle cx="87.7" cy="80.8" r=".55" fill="#2FA84F" stroke-width=".3" style="stroke:var(--td-encre)"/><circle cx="85" cy="85.4" r="3.1" fill="#2FA84F" stroke="#121016" stroke-width=".6"/><circle cx="83.8" cy="84.8" r=".6" fill="#121016"/><circle cx="86.2" cy="84.8" r=".6" fill="#121016"/><path d="M83.8 86.6Q85 87.6 86.2 86.6" fill="none" stroke="#121016" stroke-width=".5"/></g>';
/* l'alien est un dessin à part (T145) : il se place sur sa case, et peut suivre le programme */
$("#defs").innerHTML='<g id="g">'+g+'</g><g id="al">'+al+'</g>';
function grid(o){var p=EX[o.id].p,n=o.n==null?p.length/2:o.n,s='<div class="al-grille"><svg id="al-gr" class="gr'+(o.click?" ck":"")+'" viewBox="0 0 160 160" '+(o.click?'tabindex="0" role="application" aria-roledescription="grille" aria-label="Grille de A1 à O15 : les flèches déplacent la case choisie, Entrée valide." aria-describedby="al-case-aide"':'role="img" aria-label="Grille A1 à O15"')+'><use href="#g" width="160" height="160"/>';
if(n>0){var q=[8,8].concat(p.slice(0,n*2)),pts=[];for(var j=0;j<q.length;j+=2)pts.push((10*q[j]+5)+","+(10*q[j+1]+5));
s+='<polyline class="g-chemin" fill="none" stroke-width="1.4" stroke-linejoin="round" points="'+pts.join(" ")+'"/>';
for(j=2;j<q.length;j+=2)s+='<circle class="g-etape" cx="'+(10*q[j]+5)+'" cy="'+(10*q[j+1]+5)+'" r="1.2"/><text class="g-num" x="'+(10*q[j]+9.3)+'" y="'+(10*q[j+1]+9.3)+'" font-size="3.8" text-anchor="end" font-weight="700" stroke-width=".9" paint-order="stroke">'+j/2+'</text>';
if(o.final)s+='<circle cx="'+(10*q[q.length-2]+5)+'" cy="'+(10*q[q.length-1]+5)+'" r="3.8" class="g-arrivee" fill="none" stroke-width="1.3"/>'}
s+=trace(o.eleve);
var a=o.alien||[8,8];s+='<use href="#al" class="g-alien" transform="translate('+10*(a[0]-8)+' '+10*(a[1]-8)+')"/>';
if(o.click||o.pick)s+='<circle cx="'+(10*(o.pick||[8,8])[0]+5)+'" cy="'+(10*(o.pick||[8,8])[1]+5)+'" r="4" class="g-choix" stroke-width="1.2"'+(o.pick?'':' visibility="hidden"')+'/>';
if(o.click)for(var x=1;x<=15;x++)for(var y=1;y<=15;y++)s+='<rect class="c" data-act="pick" data-x="'+x+'" data-y="'+y+'" x="'+10*x+'" y="'+10*y+'" width="10" height="10"><title>'+cell(x,y)+'</title></rect>';
return s+'</svg>'+(o.legende?'<p class="al-legende"><span class="al-trait" aria-hidden="true"></span>parcours demandé · <span class="al-trait el" aria-hidden="true"></span>trajet de ton alien</p>':'')+'</div>'}
/* le trajet de l'alien de l'élève (T145) : tirets, sur le parcours demandé */
function trace(pas,k){if(!pas||!pas.length)return '<polyline class="g-eleve" points=""/>';var pts=["85,85"];pas.slice(0,k==null?pas.length:k).forEach(function(q){pts.push((10*q[1]+5)+","+(10*q[2]+5))});return '<polyline class="g-eleve" points="'+pts.join(" ")+'"/>'}
/* ---------- API Supabase (REST/RPC) ---------- */
function rpc(fn,a){if(!CFG.url||!CFG.key)return Promise.reject(new Error("Le site n’est pas encore relié à Supabase (voir config.js)."));
return fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:Object.assign({apikey:CFG.key,"Content-Type":"application/json"},CFG.key.indexOf("eyJ")===0?{Authorization:"Bearer "+CFG.key}:{}),body:JSON.stringify(a)})
.then(function(r){return r.json().catch(function(){return null}).then(function(j){if(!r.ok)throw new Error((j&&j.message)||"Erreur réseau");return j})})}

["📘","Une fiche terminée",function(){return F.some(function(f){return nOK(f[1])==f[1].length})}],
["🚀","Mi-parcours (39)",function(){return nOK(ALL)>=39}],["👽","Maître alien (78)",function(){return nOK(ALL)>=78}]];

/* ---------- valider, lancer, rejouer (T145) ----------
   La réussite et l'essai sont enregistrés exactement comme avant (save) ; seule la façon de juger un programme change :
   Python l'exécute, et l'on compare le trajet de l'alien, case par case, au parcours demandé. */
var BRAVO=["Bravo, c’est exact !","Bien joué, l’alien est arrivé à bon port !","Exact ! Tu lis le code comme un pro.","Parfait !"];
function conclure(c0,id2,good,before,faux){if(good){c0.ok=true;c0.fb=[true,pick(BRAVO)];save(id2,{solved:true,attempt:true,hints:c0.h});var nw=earned().filter(function(x){return before.indexOf(x)<0});if(nw.length)setTimeout(function(){note("🏅 Nouveau badge : "+nw.join(", "))},300)}
else{c0.fb=[false,faux||(inv(id2)?"Ce n’est pas tout à fait ça. Compare avec le parcours, ou demande un coup de pouce.":pick(["Pas tout à fait… refais le trajet ligne par ligne.","Presque ! Essaie de suivre l’alien étape par étape (coup de pouce).","Ce n’est pas la bonne case, mais continue !"]))];save(id2,{attempt:true,hints:c0.h})}
if(cur===c0){draw();annoncer(c0.fb[1]+(c0.res&&c0.res.msg&&!c0.res.attente?" "+c0.res.msg:""))}}
function validerLecture(){var id2=cur.id,before=earned();if(cur.ok||cur.corr){var f0=$("#al-case");if(f0&&f0.readOnly)return}
if(!cur.pick){cur.fb=[false,"Choisis d’abord la case où tu penses que l’alien arrive : clique sur la grille, ou écris-la."];draw();annoncer(cur.fb[1]);return}
var en=endOf(id2);conclure(cur,id2,cur.pick[0]==en[0]&&cur.pick[1]==en[1],before)}
var MSG_PY={erreur:"Python s’est arrêté sur une erreur. Lis son message ci-dessous.",hors:"ton alien sort de la grille.","trop-long":"ton programme ne s’arrête pas."};
function executer(valider){var c0=cur,id2=cur.id,e2=EX[id2],code=cur.txt,before=earned();
// la solution elle-même (même forme : mêmes lignes, mêmes décalages, espaces autour des signes non comptés) : juste tout de suite, sans attendre Python
if(valider&&AlienPython.memeForme(code,e2.s)){c0.trajet=AlienPython.pasAttendus(e2.p);c0.res=null;c0.errLigne=0;conclure(c0,id2,true,before);animer(c0.trajet,null);return}
c0.enCours=true;c0.exp=false;c0.res={attente:true,msg:AlienPython.etat().charge?"Ton programme tourne…":"Python se charge… La première fois, cela peut prendre quelques secondes."};draw();
var lent=setTimeout(function(){if(c0.enCours&&cur===c0){c0.res={attente:true,msg:"Python se charge encore : la connexion est lente. Patiente un peu…"};draw()}},15000);
AlienPython.lancer(code).then(function(r){clearTimeout(lent);c0.enCours=false;var res={code:code,ligne:r.ligne||0},vu=cur===c0;
if(r.etat=="indisponible"){
 if(valider){var good=AlienPython.memeForme(code,e2.s);res.msg="Python n’a pas pu se charger (pas de connexion, ou connexion trop lente) : ton programme a été comparé à la correction, ligne à ligne (les espaces autour des signes ne comptent pas, les décalages si). Avec Python, une solution juste écrite autrement est aussi acceptée.";c0.res=res;conclure(c0,id2,good,before)}
 else{res.msg="Python n’a pas pu se charger (pas de connexion, ou connexion trop lente) : ton programme ne peut pas être lancé pour l’instant. Tu peux quand même le valider.";c0.res=res;if(vu){draw();annoncer(res.msg)}}
 return}
c0.trajet=r.pas;c0.errLigne=0;
if(r.etat=="erreur"){res.erreur=r.detail;c0.errLigne=r.ligne;res.msg="Python s’est arrêté sur une erreur"+(r.ligne?", ligne "+r.ligne:"")+". Voici son message :"}
else if(r.etat=="hors"){var h=r.hors;c0.errLigne=h[0];res.msg="Ligne "+h[0]+" : "+h[1]+"("+h[2]+") enverrait ton alien hors de la grille (elle va de A1 à O15). Il s’arrête en "+cell(h[3],h[4])+"."}
else if(r.etat=="trop-long"){c0.errLigne=r.ligne;res.msg="Ton programme ne s’arrête pas : Python l’a arrêté"+(r.ligne?" à la ligne "+r.ligne:"")+", après "+(r.pas.length>5000?"5 000 déplacements":"20 000 lignes exécutées")+". Une boucle qui ne finit jamais ? Vérifie ce qui doit l’arrêter."}
else res.msg=r.pas.length?"Ton alien a suivi ton programme : "+r.pas.length+" déplacement"+(r.pas.length>1?"s":"")+", il finit en "+cell(r.x,r.y)+".":"Ton programme s’est exécuté, mais ton alien n’a pas bougé : il reste en H8.";
if(r.sortie)res.sortie=r.sortie;c0.res=res;
if(valider){var cmp=AlienPython.comparer(e2,code,r);if(cmp.juste)res.msg=cmp.remarque||"";else if(r.etat=="erreur")res.msg="";
 conclure(c0,id2,cmp.juste,before,cmp.juste?null:r.etat=="ok"?cmp.message+" Compare avec le parcours, ou demande un coup de pouce.":"Pas encore : "+MSG_PY[r.etat]+(cmp.message?" "+cmp.message:""))}
else if(vu){draw();annoncer(res.msg)}
if(vu){if(!valider&&r.pas.length&&window.innerWidth<=760){var g=$("#al-gr");if(g){var b=g.getBoundingClientRect();if(b.top<0||b.bottom>window.innerHeight)g.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}}animer(r.pas,true)}})}
/* revoir l'alien exécuter le programme d'un exercice déjà réussi (ou dont la correction est ouverte) */
function rejouer(){var c0=cur,id2=cur.id;c0.enCours=true;c0.res={attente:true,msg:AlienPython.etat().charge?"L’alien se prépare…":"Python se charge… La première fois, cela peut prendre quelques secondes."};draw();
AlienPython.lancer(EX[id2].c).then(function(r){c0.enCours=false;if(cur!==c0)return;
var ok=r.etat=="ok";c0.res={msg:ok?"L’alien refait le trajet : la ligne surlignée est celle qu’il exécute.":"Python n’a pas pu se charger : l’alien refait le trajet, sans montrer les lignes."};draw();
animer(ok?r.pas:AlienPython.pasAttendus(EX[id2].p),ok)})}
/* l'alien suit le trajet sur la grille, la ligne exécutée surlignée, en 4 secondes au plus ;
   mouvement réduit : un saut par déplacement (au-delà de 12, directement à l'arrivée) */
var anim=0;
function animer(pas,avecLignes){var t=++anim,svg=$("#al-gr");if(!svg||!pas||!pas.length)return;
var pl=svg.querySelector(".g-eleve"),al=svg.querySelector(".g-alien"),L=avecLignes?lignesProg():[],reduit=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var c=reduit?{cases:pas.map(function(q){return [q[1],q[2]]}),lignes:pas.map(function(q){return q[0]})}:AlienPython.cases(pas,8,8),n=c.cases.length,d=reduit?450:Math.max(30,Math.min(110,3600/n)),saut=reduit?(n>12?n:1):Math.max(1,Math.ceil(n*30/4000)),pts=["85,85"],k=0,avant=null;
function pose(x,y){al.setAttribute("transform","translate("+10*(x-8)+" "+10*(y-8)+")")}
function surligne(l){if(avant)avant.classList.remove("al-actif");avant=l?L[l-1]||null:null;if(avant)avant.classList.add("al-actif")}
pose(8,8);pl.setAttribute("points","85,85");
(function suite(){if(t!==anim||!document.body.contains(pl)){surligne(0);return}
if(k>=n){setTimeout(function(){if(t===anim)surligne(0);marquer()},d);return}
var q,fin=Math.min(n,k+saut);for(;k<fin;k++){q=c.cases[k];pts.push((10*q[0]+5)+","+(10*q[1]+5))}pl.setAttribute("points",pts.join(" "));pose(q[0],q[1]);surligne(c.lignes[k-1]);setTimeout(suite,d)})()}
/* ---------- démarrage ---------- */
if(location.hash=="#prof"){try{var tt=JSON.parse(sessionStorage.getItem("ap_t")||"null");if(tt)teacher(tt.c,tt.t).catch(function(){go("prof")});else go("prof")}catch(e){go("prof")}}
else if(S)loadStudent(S.c,S.k).catch(function(){go("login")});
else draw();
</script>
<script>
/* Mise en forme seulement (aucun appel, aucune donnée) : le choix Auto / Clair / Obscur du site, et le miroir coloré de l'éditeur. */
(function(){var bs=document.querySelectorAll("[data-theme-choix]"),m="";try{m=localStorage.getItem("theme")||""}catch(e){}
function marque(v){Array.prototype.forEach.call(bs,function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-theme-choix")===v))})}
marque(m==="light"||m==="dark"?m:"");
Array.prototype.forEach.call(bs,function(b){b.addEventListener("click",function(){var v=b.getAttribute("data-theme-choix"),h=document.documentElement;
if(v)h.setAttribute("data-theme",v);else h.removeAttribute("data-theme");try{if(v)localStorage.setItem("theme",v);else localStorage.removeItem("theme")}catch(e){}marque(v)})});
/* Le miroir suit le champ : son contenu est décalé de la valeur exacte du défilement du champ (aucune limite
   de défilement propre au miroir), et la place des barres de défilement classiques lui est retirée. */
function cale(t){var p=t.previousElementSibling;if(!p||!p.classList.contains("al-miroir"))return;
p.style.right=Math.max(0,t.offsetWidth-t.clientWidth)+"px";p.style.bottom=Math.max(0,t.offsetHeight-t.clientHeight)+"px";
var c=p.firstElementChild;if(c)c.style.transform="translate("+(-t.scrollLeft)+"px,"+(-t.scrollTop)+"px)"}
function caleTout(){var t=document.getElementById("txt");if(t)cale(t)}
app.addEventListener("input",function(e){if(e.target.id=="txt"){var p=e.target.previousElementSibling;if(p&&p.classList.contains("al-miroir"))p.innerHTML=miroir(e.target.value);cale(e.target)}});
["keyup","click","paste","select","focusin"].forEach(function(n){app.addEventListener(n,function(e){if(e.target.id=="txt")requestAnimationFrame(function(){cale(e.target)})})});
window.addEventListener("resize",caleTout);
if(window.ResizeObserver)new ResizeObserver(caleTout).observe(app);
new MutationObserver(caleTout).observe(app,{childList:true});
app.addEventListener("scroll",function(e){if(e.target.id=="txt")cale(e.target)},true)})();
</script>
