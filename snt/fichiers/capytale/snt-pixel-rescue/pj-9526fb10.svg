<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" aria-labelledby="t d">
  <title id="t">Synthèse additive : trois lumières rouge, verte et bleue qui se superposent</title>
  <desc id="d">Trois disques lumineux, un rouge, un vert et un bleu, se recouvrent en partie.</desc>
  <defs>
    <clipPath id="cr"><circle cx="150" cy="140" r="100"/></clipPath>
    <clipPath id="cg"><circle cx="270" cy="140" r="100"/></clipPath>
    <clipPath id="cb"><circle cx="210" cy="244" r="100"/></clipPath>
  </defs>
  <rect width="420" height="400" fill="#000"/>
  <circle cx="150" cy="140" r="100" fill="#ff0000"/>
  <circle cx="270" cy="140" r="100" fill="#00ff00"/>
  <circle cx="210" cy="244" r="100" fill="#0000ff"/>
  <g clip-path="url(#cr)"><circle cx="270" cy="140" r="100" fill="#ffff00"/></g>
  <g clip-path="url(#cr)"><circle cx="210" cy="244" r="100" fill="#ff00ff"/></g>
  <g clip-path="url(#cg)"><circle cx="210" cy="244" r="100" fill="#00ffff"/></g>
  <g clip-path="url(#cr)"><g clip-path="url(#cg)"><circle cx="210" cy="244" r="100" fill="#ffffff"/></g></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="108" y="110" fill="#000">Rouge</text>
    <text x="312" y="110" fill="#000">Vert</text>
    <text x="210" y="320" fill="#fff">Bleu</text>
  </g>
</svg>
