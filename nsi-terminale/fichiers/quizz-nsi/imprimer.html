<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizzNSI · version à imprimer</title>
<meta name="description" content="Les 20 questions du cours-quiz sur une feuille A4 en noir et blanc, et leur corrigé à part.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/polices.css">
<link rel="stylesheet" href="css/quizz.css">
<link rel="stylesheet" href="css/imprimer.css">
<script>try{var t=localStorage.getItem('quizz-nsi:theme');t=t&&JSON.parse(t);if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="barre ecran-seul">
  <a class="marque" href="index.html">Quizz<b>NSI</b></a>
  <span class="titre-page" id="titreCours">Version à imprimer</span>
  <div class="actions">
    <a class="bouton petit" id="basculer" href="#">Corrigé</a>
    <button class="bouton petit fort" type="button" id="imprimer">Imprimer</button>
    <button class="bouton petit" type="button" data-bascule-theme>Affichage obscur</button>
  </div>
</header>
<main>
  <p class="ecran-seul info consigne-impression">A4, noir et blanc, sans les en-têtes du navigateur. Le sujet et le corrigé s'impriment séparément.</p>
  <article id="feuille" class="feuille"></article>
</main>
<footer class="pied ecran-seul">QuizzNSI · Babash - NSI Tani Malandi · code MIT, contenus CC BY-SA 4.0 · <a href="https://github.com/babash/Babash-NSI-SNT/tree/main/nsi-terminale/fichiers/quizz-nsi" rel="noopener">Code source sur GitHub</a></footer>
<script src="js/commun.js"></script>
<script src="js/diapos.js"></script>
<script src="js/imprimer.js"></script>
</body>
</html>
