<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizzNSI · réviser seul·e</title>
<meta name="description" content="Le cours en diapositives et ses 20 questions, corrigées dans le navigateur, sans compte ni envoi de données.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/polices.css">
<link rel="stylesheet" href="css/quizz.css">
<script>try{var t=localStorage.getItem('quizz-nsi:theme');t=t&&JSON.parse(t);if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="barre">
  <a class="marque" href="index.html">Quizz<b>NSI</b></a>
  <span class="titre-page" id="titreCours">Réviser seul·e</span>
  <div class="actions">
    <label class="bouton petit"><input type="checkbox" id="questionsSeules"> Questions seules</label>
    <button class="bouton petit" type="button" data-bascule-theme>Affichage obscur</button>
  </div>
</header>
<main>
  <p class="visuel-cache" id="annonce" aria-live="polite"></p>
  <div id="scene" tabindex="-1"></div>
  <nav class="nav-diapos" aria-label="Diapositives">
    <button class="bouton" type="button" id="prec">← Précédente</button>
    <span class="compteur" id="compteur"></span>
    <div class="progression" aria-hidden="true"><span id="barre"></span></div>
    <button class="bouton fort" type="button" id="suiv">Suivante →</button>
  </nav>
  <p class="nav-diapos" style="font-size:14px;color:var(--ink-soft)">Au clavier : flèches gauche et droite pour changer de diapositive ; touches A, B, C, D pour répondre. Rien n'est envoyé : ta progression reste sur cet appareil.</p>
</main>
<footer class="pied">QuizzNSI · Babash - NSI Tani Malandi · code MIT, contenus CC BY-SA 4.0 · <a href="https://github.com/babash/Babash-NSI-SNT/tree/main/nsi-terminale/fichiers/quizz-nsi" rel="noopener">Code source sur GitHub</a></footer>
<script src="js/commun.js"></script>
<script src="js/diapos.js"></script>
<script src="js/revision.js"></script>
</body>
</html>
