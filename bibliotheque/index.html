<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque – Ressources NSI et SNT</title>
  <meta name="description" content="Toutes les ressources de SNT et de NSI, avec leurs documents : recherche par mots-clés et par notions, filtres par programme, type, niveau et usage.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0C14" media="(prefers-color-scheme: dark)">
  <script>
    /* Affichage clair ou obscur choisi dans la barre du haut (avant l'affichage, pour éviter un flash) */
    try { var m = localStorage.getItem('theme'); if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m); } catch (e) {}
  </script>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <!-- Polices hébergées sur le site (assets/fonts/) : aucun appel à un serveur de polices -->
  <link rel="preload" href="../assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/signal-commun.css">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<!--
  La bibliothèque. Rien à modifier ici : les ressources sont les fiches de donnees/ressources/,
  rassemblées à chaque publication dans donnees/bibliotheque.json (scripts/construire_bibliotheque.py).
  La page : assets/bibliotheque.js ; la recherche : assets/recherche.js.
-->
<a class="evitement" href="#contenu">Aller aux ressources</a>
<div id="site" data-page="bibliotheque">

        · <a href="https://github.com/babash/Babash-NSI-SNT">Code source sur GitHub</a>
        · conçu avec l'aide de l'IA</p></footer>
    </div>
  </noscript>
</div>
<script src="../assets/site.js"></script>
<script src="../assets/recherche.js"></script>
<script src="../assets/bibliotheque.js"></script>
<script src="../reglages.js"></script>
</body>
</html>
