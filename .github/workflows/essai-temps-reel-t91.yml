# Essai ponctuel de QuizzNSI (T91), sur cette branche seulement : jamais fusionnée dans main.
# Les sessions ne joignent pas Supabase ; ce job, lui, a Internet. Il ouvre la page projetée et deux
# pages élèves dans Chrome, avec le vrai temps réel (canaux de diffusion et de présence, clé
# « publishable », aucune table ni fonction), et vérifie : salle ouverte, deux élèves vus, une notion,
# une question, ses réponses et sa correction, puis une coupure et un retour.
name: Essai temps réel QuizzNSI T91
on:
  push:
    branches: [gardien/t91-essai-temps-reel]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Playwright
        run: |
          python3 -m pip install --quiet --break-system-packages playwright || python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Une séance en direct, à trois pages
        run: |
          cd nsi-terminale/fichiers/quizz-nsi && (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 1
          cat > /tmp/essai.py <<'PY'
          import asyncio, re, sys
          from playwright.async_api import async_playwright
          B = 'http://localhost:8765/'
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  erreurs, avertissements, requetes, sockets = [], [], [], []
                  def suivre(pg, n):
                      pg.on('pageerror', lambda e: erreurs.append(n + ' (erreur) : ' + str(e)))
                      pg.on('console', lambda m: (erreurs if m.type == 'error' else avertissements).append(n + ' (console.' + m.type + ') : ' + m.text) if m.type in ('error', 'warning') else None)
                      pg.on('request', lambda r: requetes.append(r.method + ' ' + re.sub(r'(apikey=)[^&]+', r'\1…', r.url)) if not r.url.startswith(B) else None)
                      pg.on('websocket', lambda w: sockets.append(re.sub(r'(apikey=)[^&]+', r'\1…', w.url)))
                  ok = True
                  prof = await (await b.new_context()).new_page(); suivre(prof, 'animer')
                  await prof.goto(B + 'animer.html?cours=piles-files')
                  try:
                      await prof.wait_for_function("['ok', 'ko'].some(c => document.getElementById('etatConnexion').classList.contains(c))", timeout=30000)
                  except Exception as e:
                      print('état de connexion jamais atteint :', e)
                  etat = await prof.inner_text('#etatConnexion'); code = await prof.inner_text('#code')
                  print('salle :', len(code), 'lettres ; état :', etat)
                  if 'ouverte' not in etat: ok = False
                  el = {}
                  for nom in ('Essai-A', 'Essai-B'):
                      ctx = await b.new_context(); pg = await ctx.new_page(); suivre(pg, nom)
                      await pg.goto(B + 'rejoindre.html?s=' + code)
                      await pg.fill('#champPseudo', nom); await pg.click('#rejoindre')
                      el[nom] = (ctx, pg)
                  try:
                      await prof.wait_for_function("+document.getElementById('nbEleves').textContent === 2", timeout=30000)
                  except Exception as e:
                      ok = False; print('deux élèves jamais vus :', e)
                  print('élèves vus par la page projetée :', (await prof.inner_text('#eleves')).replace('\n', ' | '))
                  for nom, (ctx, pg) in el.items(): print(nom, ':', await pg.inner_text('#connexion'), '|', (await pg.inner_text('#ecran'))[:90].replace('\n', ' '))
                  if ok:
                      await prof.click('#commencer'); await prof.wait_for_timeout(1500)
                      await prof.click('#action'); await prof.wait_for_timeout(3000)
                      for nom, (ctx, pg) in el.items():
                          t = (await pg.inner_text('#ecran'))[:90].replace('\n', ' '); print(nom, 'notion :', t)
                          if 'pile' not in t.lower(): ok = False
                      await prof.click('#action')
                      for nom, (ctx, pg) in el.items(): await pg.wait_for_selector('button.option', timeout=20000)
                      print('question vue :', (await el['Essai-A'][1].inner_text('.q-nom')))
                      await el['Essai-A'][1].click('button.option[data-choix="1"]')
                      await el['Essai-B'][1].click('button.option[data-choix="0"]')
                      try:
                          await prof.wait_for_function("/2 \\/ 2|Tout le monde/.test(document.getElementById('statutQ').textContent)", timeout=20000)
                      except Exception as e:
                          ok = False; print('réponses jamais comptées :', e)
                      print('statut projeté :', await prof.inner_text('#statutQ'))
                      for nom, (ctx, pg) in el.items():
                          try:
                              await pg.wait_for_function("/reçue/.test((document.getElementById('envoyee') || {}).textContent || '')", timeout=20000)
                          except Exception as e:
                              ok = False; print(nom, ': accusé de réception jamais reçu')
                      await prof.click('#action')
                      for nom, (ctx, pg) in el.items(): await pg.wait_for_selector('.verdict', timeout=20000)
                      points = {}
                      for nom, (ctx, pg) in el.items():
                          points[nom] = await pg.inner_text('#points')
                          print(nom, 'correction :', (await pg.inner_text('.verdict')).replace('\n', ' ')[:100], '|', points[nom])
                      print('page projetée :', await prof.inner_text('.bilan-q'))
                      a = int(points['Essai-A'].split()[0]); bpts = int(points['Essai-B'].split()[0])
                      if not (110 <= a <= 130 and bpts == 10): ok = False; print('points inattendus')
                      # coupure et retour de Essai-B (même pseudo, même appareil : mêmes points)
                      ctx, pg = el['Essai-B']; await pg.close()
                      try:
                          await prof.wait_for_function("+document.getElementById('nbEleves').textContent === 1", timeout=30000)
                          print('après la coupure :', (await prof.inner_text('#eleves')).replace('\n', ' | '))
                      except Exception as e:
                          ok = False; print('coupure jamais vue :', e)
                      pg = await ctx.new_page(); suivre(pg, 'Essai-B (retour)')
                      await pg.goto(B + 'rejoindre.html?s=' + code); await pg.fill('#champPseudo', 'Essai-B'); await pg.click('#rejoindre')
                      try:
                          await prof.wait_for_function("+document.getElementById('nbEleves').textContent === 2", timeout=30000)
                          await pg.wait_for_selector('.verdict', timeout=20000)
                          print('retour :', await pg.inner_text('#points'), '|', (await pg.inner_text('.verdict')).replace('\n', ' ')[:80])
                          if not (await pg.inner_text('#points')).startswith('10 '): ok = False
                      except Exception as e:
                          ok = False; print('retour impossible :', e)
                  tables = [u for u in requetes if re.search(r'/(rest|functions|auth|storage|graphql)/v1', u)]
                  print('websockets :', sorted(set(sockets)))
                  print('requêtes vers un autre site :', sorted(set(requetes)))
                  print('appels à une table, une fonction, auth ou storage :', tables)
                  print('avertissements :', avertissements[:20])
                  print('erreurs :', erreurs[:20])
                  ok = ok and not tables and not erreurs
                  print('RÉSULTAT :', 'OK' if ok else 'ÉCHEC')
                  await b.close(); sys.exit(0 if ok else 1)
          asyncio.run(main())
          PY
          python3 /tmp/essai.py
