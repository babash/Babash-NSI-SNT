# Essai ponctuel (T42, bascule de Lagon Arena), sur cette branche seulement : jamais fusionnée dans main.
# Les fichiers servis par https://babash.github.io/lagon-arena/ sont ceux de main (f629b0a) ; la page
# vise la base unique ; UN seul appel à la base, en lecture et sans donnée d'élève : lagon_heure_serveur.
name: Essai Lagon Arena T42 (fichiers servis, base unique)
on:
  push:
    branches: [gardien/t91-essai-temps-reel]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Fichiers servis identiques à main (babash/lagon-arena, f629b0a)
        run: |
          git clone --quiet https://github.com/babash/lagon-arena /tmp/lagon
          cd /tmp/lagon && git checkout --quiet f629b0a1c8c9 && echo "commit attendu : $(git rev-parse HEAD) ; main : $(git rev-parse origin/main)"
          total=0; pareils=0; ecarts=0
          for f in $(git ls-files | grep -v -E '(^|/)[.]' | grep -E '\.(html|js|css|json|svg|md)$'); do
            total=$((total+1)); ok=0
            for essai in 1 2 3; do
              if curl -fsS -o /tmp/servi "https://babash.github.io/lagon-arena/$f" && cmp -s /tmp/servi "$f"; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" = 1 ]; then pareils=$((pareils+1)); else ecarts=$((ecarts+1)); echo "DIFFÉRENT ou absent : $f"; fi
          done
          echo "$pareils fichier(s) servi(s) identique(s) à f629b0a sur $total ; $ecarts écart(s)"
          curl -fsS https://babash.github.io/lagon-arena/js/config.js | grep -o 'https://[a-z]*\.supabase\.co' | sort -u
          [ "$ecarts" -eq 0 ]
      - name: Un seul appel à la base, sans donnée d'élève (lagon_heure_serveur)
        run: |
          CLE=$(curl -fsS https://babash.github.io/lagon-arena/js/config.js | grep -o 'sb_publishable_[A-Za-z0-9_-]*' | head -1)
          code=$(curl -sS -o /tmp/heure -w '%{http_code}' -X POST https://cukahpyqkljiddmimpyi.supabase.co/rest/v1/rpc/lagon_heure_serveur -H "apikey: $CLE" -H 'Content-Type: application/json' -d '{}')
          echo "lagon_heure_serveur : HTTP $code ; réponse : $(head -c 60 /tmp/heure)"
          [ "$code" = "200" ]
