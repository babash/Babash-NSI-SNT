# Essai ponctuel de QuizzNSI (T91), sur cette branche seulement : jamais fusionnée dans main.
# Les sessions ne joignent pas Supabase ; ce job, lui, a Internet. Il ouvre la page projetée et deux
# pages élèves dans Chrome, avec le vrai temps réel (canaux de diffusion et de présence, clé
# « publishable », aucune table ni fonction), et vérifie : salle ouverte, deux élèves vus, une notion,
# une question, ses réponses et sa correction, puis une coupure et un retour.
name: Essai temps réel QuizzNSI T92 (site en ligne)
on:
  push:
    branches: [gardien/t91-essai-temps-reel]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Playwright
        run: |
          python3 -m pip install --quiet --break-system-packages playwright || python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Une séance en direct, à trois pages
        run: |
          cd nsi-terminale/fichiers/quizz-nsi && (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 1
          cat > /tmp/essai.py <<'PY'
          import asyncio, re, sys
          from playwright.async_api import async_playwright
          B = 'https://babash.github.io/Babash-NSI-SNT/nsi-terminale/fichiers/quizz-nsi/'
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  erreurs, avertissements, requetes, sockets = [], [], [], []
                  def suivre(pg, n):
                      pg.on('pageerror', lambda e: erreurs.append(n + ' (erreur) : ' + str(e)))
                      pg.on('console', lambda m: (erreurs if m.type == 'error' else avertissements).append(n + ' (console.' + m.type + ') : ' + m.text) if m.type in ('error', 'warning') else None)
                      pg.on('request', lambda r: requetes.append(r.method + ' ' + re.sub(r'(apikey=)[^&]+', r'\1…', r.url)) if not r.url.startswith(B) else None)
                      pg.on('websocket', lambda w: sockets.append(re.sub(r'(apikey=)[^&]+', r'\1…', w.url)))
                  ok = True
                  prof = await (await b.new_context()).new_page(); suivre(prof, 'animer')
                  await prof.goto(B + 'animer.html?cours=piles-files')
                  try:
                      await prof.wait_for_function("['ok', 'ko'].some(c => document.getElementById('etatConnexion').classList.contains(c))", timeout=30000)
                  except Exception as e:
                      print('état de connexion jamais atteint :', e)
                  etat = await prof.inner_text('#etatConnexion'); code = await prof.inner_text('#code')
                  print('salle :', len(code), 'lettres ; état :', etat)
                  if 'ouverte' not in etat: ok = False
                  espion = await (await b.new_context()).new_page(); suivre(espion, 'espion')
                  await espion.goto(B + 'rejoindre.html')
                  await espion.evaluate("""code => new Promise(res => {
                      const cfg = window.QUIZZ_CONFIG, T = window.TempsReel;
                      const client = new T.RealtimeClient(cfg.SUPABASE_URL.replace(/^http/, 'ws') + '/realtime/v1', { params: { apikey: cfg.SUPABASE_KEY } });
                      const ch = client.channel('quizz-nsi:' + code, { config: { broadcast: { self: false } } });
                      window.__espion = []; window.__canal = ch;
                      ch.on('broadcast', { event: 'm' }, ({ payload }) => window.__espion.push(payload));
                      ch.subscribe(st => { if (st === 'SUBSCRIBED') res(true); });
                      setTimeout(() => res(false), 15000);
                  })""", code)
                  el = {}
                  for nom in ('Essai-A', 'Essai-B'):
                      ctx = await b.new_context(); pg = await ctx.new_page(); suivre(pg, nom)
                      await pg.goto(B + 'rejoindre.html?s=' + code)
                      await pg.fill('#champPseudo', nom); await pg.click('#rejoindre')
                      el[nom] = (ctx, pg)
                  try:
                      await prof.wait_for_function("+document.getElementById('nbEleves').textContent === 2", timeout=30000)
                  except Exception as e:
                      ok = False; print('deux élèves jamais vus :', e)
                  print('élèves vus par la page projetée :', (await prof.inner_text('#eleves')).replace('\n', ' | '))
                  for nom, (ctx, pg) in el.items(): print(nom, ':', await pg.inner_text('#connexion'), '|', (await pg.inner_text('#ecran'))[:90].replace('\n', ' '))
                  if ok:
                      await prof.click('#commencer'); await prof.wait_for_timeout(1500)
                      ecarts, etapes = [], 0
                      async def comparer(pages):
                          vp = await prof.evaluate("document.querySelectorAll('#scene .frag.vu').length")
                          tp = await prof.evaluate("(document.querySelector('#scene h2') || {}).textContent || ''")
                          for nom, pg in pages.items():
                              ok2 = False
                              for _ in range(16):
                                  ve = await pg.evaluate("document.querySelectorAll('#ecran .frag.vu').length")
                                  te = await pg.evaluate("(document.querySelector('#ecran h2') || {}).textContent || ''")
                                  if ve == vp and te == tp: ok2 = True; break
                                  await pg.wait_for_timeout(500)
                              if not ok2: ecarts.append((nom, tp[:30], vp, ve, te[:30]))
                      async def jusqua_question(pages):
                          nonlocal_etapes = 0
                          while not await prof.query_selector('#scene .d-question') and nonlocal_etapes < 40:
                              await prof.click('#action'); nonlocal_etapes += 1; await prof.wait_for_timeout(700)
                              if not await prof.query_selector('#scene .d-question'): await comparer(pages)
                          return nonlocal_etapes
                      etapes = await jusqua_question({n: pg for n, (c, pg) in el.items()})
                      print('apparitions suivies par les téléphones :', etapes, 'pas jusqu\'à la question 1 ; écarts :', ecarts)
                      if ecarts: ok = False
                      for nom, (ctx, pg) in el.items(): await pg.wait_for_selector('button.option', timeout=20000)
                      print('question vue :', (await el['Essai-A'][1].inner_text('.q-nom')))
                      await el['Essai-A'][1].click('button.option[data-choix="1"]')
                      await el['Essai-B'][1].click('button.option[data-choix="0"]')
                      try:
                          await prof.wait_for_function("/2 \\/ 2|Tout le monde/.test(document.getElementById('statutQ').textContent)", timeout=20000)
                      except Exception as e:
                          ok = False; print('réponses jamais comptées :', e)
                      print('statut projeté :', await prof.inner_text('#statutQ'))
                      for nom, (ctx, pg) in el.items():
                          try:
                              await pg.wait_for_function("/reçue/.test((document.getElementById('envoyee') || {}).textContent || '')", timeout=20000)
                          except Exception as e:
                              ok = False; print(nom, ': accusé de réception jamais reçu')
                      await prof.click('#action')
                      for nom, (ctx, pg) in el.items(): await pg.wait_for_selector('.verdict', timeout=20000)
                      points = {}
                      for nom, (ctx, pg) in el.items():
                          points[nom] = await pg.inner_text('#points')
                          print(nom, 'correction :', (await pg.inner_text('.verdict')).replace('\n', ' ')[:100], '|', points[nom])
                      print('page projetée :', await prof.inner_text('.bilan-q'))
                      a = int(points['Essai-A'].split()[0]); bpts = int(points['Essai-B'].split()[0])
                      if not (110 <= a <= 130 and bpts == 10): ok = False; print('points inattendus')
                      # coupure et retour de Essai-B (même pseudo, même appareil : mêmes points)
                      ctx, pg = el['Essai-B']; await pg.close()
                      try:
                          await prof.wait_for_function("+document.getElementById('nbEleves').textContent === 1", timeout=30000)
                          print('après la coupure :', (await prof.inner_text('#eleves')).replace('\n', ' | '))
                      except Exception as e:
                          ok = False; print('coupure jamais vue :', e)
                      pg = await ctx.new_page(); suivre(pg, 'Essai-B (retour)')
                      await pg.goto(B + 'rejoindre.html?s=' + code); await pg.fill('#champPseudo', 'Essai-B'); await pg.click('#rejoindre')
                      try:
                          await prof.wait_for_function("+document.getElementById('nbEleves').textContent === 2", timeout=30000)
                          await pg.wait_for_selector('.verdict', timeout=20000)
                          print('retour (page rouverte dans un nouvel onglet) :', await pg.inner_text('#points'), '|', (await pg.inner_text('.verdict')).replace('\n', ' ')[:80])
                          if not (await pg.inner_text('#points')).startswith('10 '): ok = False; print('points perdus à la réouverture')
                      except Exception as e:
                          ok = False; print('retour impossible :', e)
                  if ok:
                      await prof.reload(); suivre_ok = True
                      try:
                          await prof.wait_for_function("document.getElementById('etatConnexion').classList.contains('ok')", timeout=30000)
                          await prof.click('#reprendre'); await prof.wait_for_timeout(1500)
                          pages = {'Essai-A': el['Essai-A'][1], 'Essai-B': pg}
                          await prof.click('#action'); await prof.wait_for_timeout(700)
                          ecarts.clear(); n2 = await jusqua_question(pages)
                          print('après le rechargement, apparitions suivies :', n2, 'pas ; écarts :', ecarts)
                          if ecarts: ok = False
                          for nom, q in pages.items(): await q.wait_for_function("document.querySelector('.q-nom') && /LIFO/.test(document.querySelector('.q-nom').textContent)", timeout=20000)
                          await pages['Essai-A'].click('button.option[data-choix="1"]'); await pages['Essai-B'].click('button.option[data-choix="0"]')
                          await prof.wait_for_function("/2 \\/ 2|Tout le monde/.test(document.getElementById('statutQ').textContent)", timeout=30000)
                          print('page projetée rechargée (nouvelle clé), question 2 :', await prof.inner_text('#statutQ'))
                          await prof.click('#action')
                          for nom, q in pages.items(): await q.wait_for_selector('.verdict', timeout=20000); print(nom, 'question 2 :', (await q.inner_text('.verdict')).replace('\n', ' ')[:60], '|', await q.inner_text('#points'))
                      except Exception as e:
                          ok = False; print('après le rechargement de la page projetée :', e)
                      # une fausse page projetée entre dans la présence : la vraie doit la signaler
                      faux = await espion.evaluate("""code => new Promise(async res => {
                          const cfg = window.QUIZZ_CONFIG, T = window.TempsReel, h = await QuizzNSI.chiffre.hote();
                          const c2 = new T.RealtimeClient(cfg.SUPABASE_URL.replace(/^http/, 'ws') + '/realtime/v1', { params: { apikey: cfg.SUPABASE_KEY } });
                          const ch = c2.channel('quizz-nsi:' + code, { config: { presence: { key: 'fedcba9876543210' } } });
                          ch.subscribe(async st => { if (st === 'SUBSCRIBED') { await ch.track({ id: 'fedcba9876543210', role: 'hote', cle: h.publique }); res(true); } });
                          setTimeout(() => res(false), 15000);
                      })""", code)
                      try:
                          await prof.wait_for_function("!document.getElementById('autreHote').hidden", timeout=20000)
                          print('fausse page projetée signalée :', await prof.inner_text('#autreHote'))
                      except Exception as e:
                          ok = False; print('fausse page projetée non signalée :', faux, e)
                      vus = await espion.evaluate("window.__espion")
                      types = {}
                      for m in vus: types[m.get('t')] = types.get(m.get('t'), 0) + 1
                      print('espion : messages reçus par type :', types)
                      reps = [m for m in vus if m.get('t') == 'rep']
                      print('espion : clés des réponses :', sorted({tuple(sorted(m.keys())) for m in reps}))
                      fuites = [m for m in vus if m.get('t') != 'rep' and any(k in m for k in ('res', 'c', 'gain', 'total', 'place', 'detail', 'bilan', 'moi'))]
                      print('espion : messages avec un résultat individuel :', fuites[:3])
                      pres = await espion.evaluate("Object.values(window.__canal.presenceState()).map(l => Object.keys(l[l.length - 1]).sort().join(','))")
                      print('espion : champs de présence :', sorted(set(pres)))
                      if not reps or any(set(m.keys()) != {'t', 'de', 'iv', 'donnees'} for m in reps) or fuites: ok = False
                  tables = [u for u in requetes if re.search(r'/(rest|functions|auth|storage|graphql)/v1', u)]
                  print('websockets :', sorted(set(sockets)))
                  print('requêtes vers un autre site :', sorted(set(requetes)))
                  print('appels à une table, une fonction, auth ou storage :', tables)
                  print('avertissements :', avertissements[:20])
                  print('erreurs :', erreurs[:20])
                  ok = ok and not tables and not erreurs
                  print('RÉSULTAT :', 'OK' if ok else 'ÉCHEC')
                  await b.close(); sys.exit(0 if ok else 1)
          asyncio.run(main())
          PY
          python3 /tmp/essai.py
