# Essai ponctuel (T91, puis T93 et T93b), sur cette branche seulement : jamais fusionnée dans main.
# T93b : les pages de l'ancienne adresse de QuizzNSI, publiées par le site, mènent à la nouvelle
# (https://babash.github.io/QuizzNSI/) en gardant la page, les paramètres et l'ancre.
name: Essai QuizzNSI T93b (redirections de l'ancienne adresse)
on:
  push:
    branches: [gardien/t91-essai-temps-reel]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Playwright
        run: |
          python3 -m pip install --quiet --break-system-packages playwright || python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Fichiers servis à l'ancienne adresse (main du site, cf9d5d9e811576faf76ca9a63f1832e97026048d)
        run: |
          A=https://babash.github.io/Babash-NSI-SNT/nsi-terminale/fichiers/quizz-nsi
          R=https://raw.githubusercontent.com/babash/Babash-NSI-SNT/cf9d5d9e811576faf76ca9a63f1832e97026048d/nsi-terminale/fichiers/quizz-nsi
          ecarts=0
          for f in index.html animer.html imprimer.html rejoindre.html revision.html; do
            curl -fsS --retry 3 -o /tmp/depot "$R/$f"
            if curl -fsS --retry 3 -o /tmp/servi "$A/$f" && cmp -s /tmp/servi /tmp/depot; then echo "servi identique au dépôt : $f"; else echo "DIFFÉRENT ou absent : $f"; ecarts=$((ecarts+1)); fi
          done
          curl -sS -o /dev/null -w "dossier : HTTP %{http_code}\n" "$A/"
          for f in js/commun.js cours/piles-files.json config.js vendor/temps-reel.js; do
            for essai in 1 2 3 4 5; do c=$(curl -sS -o /dev/null -w '%{http_code}' "$A/$f"); case "$c" in 5*) echo "  $f : HTTP $c (essai $essai, erreur passagère du serveur : on réessaie)"; sleep 6;; *) break;; esac; done
            echo "supprimé : $f -> HTTP $c"; [ "$c" = "404" ] || ecarts=$((ecarts+1))
          done
          echo "$ecarts écart(s)"; [ "$ecarts" -eq 0 ]
      - name: Les redirections dans Chromium
        run: |
          cat > /tmp/redir.py <<'PY'
          import asyncio, sys
          from playwright.async_api import async_playwright
          A = 'https://babash.github.io/Babash-NSI-SNT/nsi-terminale/fichiers/quizz-nsi/'
          N = 'https://babash.github.io/QuizzNSI/'
          CAS = [('', N), ('index.html', N), ('index.html?x=1#y', N + '?x=1#y'),
                 ('animer.html?cours=piles-files&demo#d3', N + 'animer.html?cours=piles-files&demo#d3'),
                 ('imprimer.html?cours=piles-files&corrige', N + 'imprimer.html?cours=piles-files&corrige'),
                 ('rejoindre.html?s=ABCD', N + 'rejoindre.html?s=ABCD'),
                 ('revision.html?cours=piles-files#q5', N + 'revision.html?cours=piles-files#q5')]
          async def main():
              ok = True
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context()
                  for chemin, attendu in CAS:
                      pg = await ctx.new_page(); err = []
                      pg.on('pageerror', lambda e: err.append(str(e)))
                      try:
                          await pg.goto(A + chemin)
                          await pg.wait_for_url(lambda u: u == attendu, timeout=20000)
                          await pg.wait_for_load_state('load'); await pg.wait_for_timeout(800)
                          titre = await pg.title()
                          bon = not err and titre.startswith('QuizzNSI')
                          print(('ok   ' if bon else 'ÉCHEC'), chemin or '(dossier)', '->', pg.url, '|', titre, '| erreurs', err)
                      except Exception as e:
                          bon = False; print('ÉCHEC', chemin, ':', pg.url, e)
                      ok = ok and bon
                      if chemin.startswith('rejoindre'):
                          print('     champ du code sur la nouvelle page :', await pg.evaluate("(document.querySelector('#champCode') || {}).value"))
                      await pg.close()
                  await ctx.close()
                  ctx = await b.new_context(java_script_enabled=False)
                  for page in ('index.html', 'animer.html', 'imprimer.html', 'rejoindre.html', 'revision.html'):
                      pg = await ctx.new_page(); cible = N if page == 'index.html' else N + page
                      try:
                          await pg.goto(A + page + '?s=ABCD'); await pg.wait_for_url(lambda u: u == cible, timeout=20000)
                          print('ok    sans JavaScript,', page, '-> refresh vers', pg.url)
                      except Exception as e:
                          ok = False; print('ÉCHEC sans JavaScript,', page, ':', pg.url, e)
                      await pg.close()
                  await b.close()
              print('RÉSULTAT :', 'OK' if ok else 'ÉCHEC'); sys.exit(0 if ok else 1)
          asyncio.run(main())
          PY
          python3 /tmp/redir.py
