# Essai ponctuel (T91, T93, T93b, T93c), sur cette branche seulement : jamais fusionnée dans main.
# T93c : https://babash.github.io/QuizzNSI/ sert les fichiers de main (310e17f) ; l'ancienne adresse
# redirige toujours.
name: Essai QuizzNSI T93c (fichiers servis de main, redirections)
on:
  push:
    branches: [gardien/t91-essai-temps-reel]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Fichiers servis identiques à main (babash/QuizzNSI, 310e17f)
        run: |
          git clone --quiet https://github.com/babash/QuizzNSI /tmp/quizznsi
          cd /tmp/quizznsi && git checkout --quiet 310e17feb48e8b6d29f609de3865006c7e1e0ab2 && echo "commit attendu : $(git rev-parse HEAD) ; main : $(git rev-parse origin/main)"
          total=0; pareils=0; ecarts=0
          for f in $(git ls-files | grep -v -E '(^|/)[.]'); do
            total=$((total+1)); ok=0
            for essai in 1 2 3 4; do
              if curl -fsS -o /tmp/servi "https://babash.github.io/QuizzNSI/$f" && cmp -s /tmp/servi "$f"; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" = 1 ]; then pareils=$((pareils+1)); else ecarts=$((ecarts+1)); echo "DIFFÉRENT ou absent : $f"; fi
          done
          echo "$pareils fichier(s) servi(s) identique(s) à 310e17f sur $total (fichiers commençant par un point exclus) ; $ecarts écart(s)"
          [ "$ecarts" -eq 0 ]
      - name: L'ancienne adresse redirige toujours
        run: |
          for p in "" "rejoindre.html?s=ABCD" "animer.html?cours=piles-files&demo"; do
            curl -fsS -o /tmp/p "https://babash.github.io/Babash-NSI-SNT/nsi-terminale/fichiers/quizz-nsi/$p"
            grep -q "location.replace('https://babash.github.io/QuizzNSI/" /tmp/p && echo "redirection présente : ${p:-(dossier)}"
          done
