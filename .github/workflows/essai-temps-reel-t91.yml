# Essai ponctuel (T110), sur cette branche seulement : jamais fusionnée dans main.
# Le script d'installation de pdftotext (archi/t110-pdftotext, b1f78b3), essayé deux fois :
# sur la machine telle quelle, puis sur une machine qui imite l'image du 16/11 (sans pdftotext ni sources Ubuntu).
name: Essai T110 (installation de pdftotext)
on:
  push:
    branches: [gardien/t91-essai-temps-reel]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Le script de la branche
        run: |
          curl -fsSL https://raw.githubusercontent.com/babash/Babash-NSI-SNT/b1f78b3/scripts/installer_pdftotext.sh -o /tmp/installer.sh
          sha256sum /tmp/installer.sh; head -3 /tmp/installer.sh
          grep -E '^ *(VERSION|PRETTY_NAME)=' /etc/os-release
      - name: 1. Sur la machine telle quelle
        run: bash /tmp/installer.sh && pdftotext -v 2>&1 | head -1
      - name: 2. En imitant l'image du 16/11 (ni pdftotext ni sources Ubuntu)
        run: |
          sudo apt-get remove -y -q poppler-utils >/dev/null 2>&1 || true
          ! command -v pdftotext && echo "pdftotext retiré"
          sudo mkdir -p /tmp/sources-mises-de-cote
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do [ -f "$f" ] && sudo mv "$f" /tmp/sources-mises-de-cote/ || true; done
          ls /etc/apt/sources.list.d/ /etc/apt/sources.list 2>&1 | head
          bash /tmp/installer.sh; echo "code du script : $?"
          pdftotext -v 2>&1 | head -1
          printf '%%PDF-1.1\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj 2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj 3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj 4 0 obj<</Length 44>>stream\nBT /F1 12 Tf 20 100 Td (Bonjour T110) Tj ET\nendstream endobj 5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\ntrailer<</Root 1 0 R>>\n' > /tmp/essai.pdf
          pdftotext /tmp/essai.pdf - 2>/dev/null | head -2
