# Essai ponctuel (T96, Court-circuit), sur cette branche seulement : jamais fusionnée dans main.
# Les fichiers servis par https://babash.github.io/court-circuit/ sont ceux de main (09e7b0a9b068c811d02e0b687cdb30d73df4b970). Aucun appel à la base.
name: Essai Court-circuit (fichiers servis)
on:
  push:
    branches: [gardien/t91-essai-temps-reel]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Fichiers servis identiques à main (babash/court-circuit)
        run: |
          git clone --quiet https://github.com/babash/court-circuit /tmp/cc
          cd /tmp/cc && git checkout --quiet 09e7b0a9b068c811d02e0b687cdb30d73df4b970 && echo "commit attendu : $(git rev-parse HEAD) ; main : $(git rev-parse origin/main)"
          total=0; pareils=0; ecarts=0
          for f in $(git ls-files | grep -v -E '(^|/)[.]' | grep -E '\.(html|js|css|json|svg|md|txt)$'); do
            total=$((total+1)); ok=0
            for essai in 1 2 3; do
              if curl -fsS -o /tmp/servi "https://babash.github.io/court-circuit/$f" && cmp -s /tmp/servi "$f"; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" = 1 ]; then pareils=$((pareils+1)); else ecarts=$((ecarts+1)); echo "DIFFÉRENT ou absent : $f"; fi
          done
          echo "$pareils fichier(s) servi(s) identique(s) sur $total ; $ecarts écart(s)"
          curl -fsS https://babash.github.io/court-circuit/js/reseau.js | grep -c 'menage()' | sed 's/^/appels et définition de menage dans reseau.js en ligne : /'
          [ "$ecarts" -eq 0 ]
