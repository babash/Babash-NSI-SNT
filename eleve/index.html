<!--
  Ma planque (T101b) : l'espace de l'élève dans le compte commun (un code pour toutes les applications).
  Pas encore liée depuis l'accueil : elle est en démonstration tant que reglages.js dit
  COMPTE_COMMUN_EN_LIGNE: false. Rien à modifier ici. Le client : assets/compte-commun.js ;
  la page : assets/planque.js ; les morceaux communs : assets/compte-commun-pages.js.
  Lien de classe : eleve/?classe=XXXX (4 lettres).
-->
